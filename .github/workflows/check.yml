name: Check your file

# pull_request_target runs this workflow and the validator as they are on main,
# so a pull request can't edit the check to pass itself, and first-time
# contributors don't wait for a maintainer to approve the run.
# Safe because the pull request is never checked out or run: its commits are
# only fetched, and the validator reads its files with git show. The token is read-only.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request without checking it out
        run: git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check members file
        run: >
          node scripts/validate.mjs
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --author "${{ github.event.pull_request.user.login }}"
